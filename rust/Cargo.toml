[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/lanes",
    "crates/steering",
    "crates/telepathyd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
anyhow = "1"
async-trait = "0.1"
