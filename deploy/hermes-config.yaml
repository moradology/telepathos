# Minimal gateway config for the relay Docker test.
# Provider/model choice happens via env or `hermes model` normally;
# this file exists so the gateway boots headless.
gateway:
  relay_url: "http://host.docker.internal:8790"

# No toolset gates: tools may produce any artifact (images included — they can
# be sent along as links/attachments). The constraint is on RESPONSE
# COMPOSITION, enforced by the platform hint in telepathyd's descriptor:
# every reply must carry its own spoken summary; an artifact is never the
# whole reply.


platforms:
  relay:
    extra:
      relay_url: "http://host.docker.internal:8790"
